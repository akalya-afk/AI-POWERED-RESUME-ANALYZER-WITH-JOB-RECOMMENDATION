{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center min-vh-75 align-items-center slide-up">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4 glass-card p-2">
            <div class="card-body p-5">
                <div class="text-center mb-5">
                    <div class="d-inline-flex bg-orange-soft text-orange rounded-circle p-3 mb-3">
                        <i class="bi bi-box-arrow-in-right fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Welcome Back</h3>
                    <p class="text-muted small">Log in to track your ATS status.</p>
                </div>
                <form method="POST">
                    <div class="form-floating mb-3">
                        <input type="email" name="email" class="form-control rounded-pill px-4 focus-orange border-0 bg-light" id="floatingEmail" placeholder="name@example.com" required>
                        <label for="floatingEmail" class="ps-4 text-muted"><i class="bi bi-envelope me-2"></i> Email Address</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" name="password" class="form-control rounded-pill px-4 focus-orange border-0 bg-light" id="floatingPassword" placeholder="Password" required>
                        <label for="floatingPassword" class="ps-4 text-muted"><i class="bi bi-lock me-2"></i> Password</label>
                    </div>
                    <button type="submit" class="btn btn-orange rounded-pill w-100 py-3 fw-bold shadow-sm icon-hover">
                        Secure Login <i class="bi bi-shield-check ms-2 transition-icon"></i>
                    </button>
                    <div class="text-center mt-4">
                        <span class="text-muted small">New to TalentATS? <a href="{{ url_for('signup') }}" class="text-orange fw-bold text-decoration-none border-bottom border-orange">Create account</a></span>
                    </div>
                    <hr class="my-4 border-muted">
                    <div class="text-center">
                        <a href="{{ url_for('hr_login') }}" class="text-muted text-decoration-none small fw-medium transition-all hover-orange"><i class="bi bi-building"></i> HR Portal Access</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
